image: golang:1.22-alpine

variables:
  CGO_ENABLED: "0"

stages:
  - validate
  - test
  - build
  - release

before_script:
  - apk add --no-cache git make bash ffmpeg

lint_and_vet:
  stage: validate
  script:
    - go vet ./...
    - go mod tidy
    - git diff --exit-code go.mod go.sum

unit_tests:
  stage: test
  script:
    - go test -v -coverprofile=coverage.out ./...
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    paths:
      - coverage.out
    expire_in: 7 days

build_binaries:
  stage: build
  parallel:
    matrix:
      - GOOS: [linux, darwin]
        GOARCH: [amd64, arm64]
      - GOOS: [windows]
        GOARCH: [amd64]
  script:
    - mkdir -p dist
    - EXT=""
    - if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
    - BINARY="mediacruncher-${GOOS}-${GOARCH}${EXT}"
    - go build -trimpath -ldflags="-s -w -X main.Version=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}" -o "dist/${BINARY}" ./cmd/mediacruncher
    - cd dist && sha256sum "${BINARY}" > "${BINARY}.sha256"
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG generated by GitLab CI pipeline.'
    assets:
      links:
        - name: 'Linux AMD64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mediacruncher/${CI_COMMIT_TAG}/mediacruncher-linux-amd64'
        - name: 'Windows AMD64'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mediacruncher/${CI_COMMIT_TAG}/mediacruncher-windows-amd64.exe'
