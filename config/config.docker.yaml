# MediaCruncher Container Configuration

database:
  path: "/var/lib/mediacruncher/mediacruncher.db"
  busy_timeout: 5000

filesystem:
  scan_interval: "20s"
  ingestion_capacity: 5000
  scopes:
    - path: "/media"
      extensions:
        - ".mp4"
        - ".mkv"
        - ".mov"
        - ".avi"
        - ".m4v"
        - ".webm"
      exclusions:
        - "*.part"
        - "*.tmp"
        - "*sample*"
        - "*extras*"
      max_depth: 10
      follow_symlinks: false

evaluation:
  default_action: "transcode"
  default_preset: "balanced-hevc"

  audio_preservation:
    retain_surround_tracks: true
    copy_lossless_audio: true
    preferred_languages:
      - "eng"
      - "ita"
      - "und"

  codec_aliases:
    h264: "h264"
    avc1: "h264"
    hevc: "hevc"
    h265: "hevc"
    hev1: "hevc"
    av01: "av1"
    av1:  "av1"

  rules:
    - name: "Skip Modern AV1 and HEVC"
      priority: 100
      conditions:
        codec: "hevc,av1"
      action: "skip"

    - name: "Transcode H.264 SDR to Balanced HEVC"
      priority: 80
      conditions:
        codec: "h264"
        is_hdr: "false"
      action: "transcode"
      preset: "balanced-hevc"
      audio_action: "copy"
      retain_subtitles: true

    - name: "Transcode Legacy MPEG4 to HEVC"
      priority: 70
      conditions:
        codec: "mpeg4,msmpeg4,divx"
      action: "transcode"
      preset: "balanced-hevc"
      audio_action: "copy"
      retain_subtitles: true

transcoder:
  hardware_acceleration: "auto" # auto, nvenc, qsv, amf, vaapi, cpu
  staging_dir: "/tmp/mediacruncher/staging"
  vmaf_enabled: true
  vmaf_threshold: 92.0
  vmaf_sample_count: 3
  vmaf_sample_duration: 30
  skip_if_larger: true
  overwrite_source: false # true: sovrascrive il file originale in-place; false: salva una nuova copia
  output_dir: ""         # se overwrite_source è false, cartella personalizzata (vuoto = stessa cartella del sorgente)
  output_suffix: "_crunched" # suffisso applicato al nome file se overwrite_source è false
  max_job_duration: "4h"

  presets:
    - name: "balanced-hevc"
      video_codec: "hevc"
      quality_crf: 22
      preset_speed: "medium"
      audio_codec: "copy"

    - name: "balanced-h264"
      video_codec: "h264"
      quality_crf: 22
      preset_speed: "medium"
      audio_codec: "copy"

    - name: "efficient-av1"
      video_codec: "av1"
      quality_crf: 26
      preset_speed: "6"
      audio_codec: "opus"
      audio_bitrate: "128k"

concurrency:
  worker_count: 1
  gpu_semaphore_limit: 1
  cpu_semaphore_limit: 0
  prefetch_buffer_depth: 50
  drain_timeout: "5m"
  retry_max_attempts: 3
  retry_base_interval: "15s"

notification:
  enabled: false
  batch_window: "30s"
  batch_max_size: 10
  rate_limit_per_minute: 30
  channels: []

observability:
  log_level: "info"
  log_json: true
  metrics_port: 9090
