services:
  mediacruncher:
    image: ghcr.io/pe46dro/mediacruncher:latest
    build:
      context: .
      args:
        BUILD_VERSION: compose-local
        BUILD_COMMIT: local
        BUILD_TIME: "00000000-000000"
    restart: unless-stopped
    environment:
      - MC_CONFIG_DIR=/app/config
      - MC_DATABASE_PATH=/app/data/mediacruncher.db
      - MC_LOG_LEVEL=info
      - MC_WEB_ADDR=0.0.0.0:8080
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./media:/app/media
