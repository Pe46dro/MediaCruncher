name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'release/**', 'feat/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]

env:
  GO_VERSION: '1.25'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Go Vet
        run: go vet ./...

      - name: Verify Go Module Tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Unit & Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build-matrix:
    name: Cross-Platform Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            binary: mediacruncher-linux-amd64
          - os: linux
            arch: arm64
            binary: mediacruncher-linux-arm64
          - os: windows
            arch: amd64
            binary: mediacruncher-windows-amd64.exe
          - os: darwin
            arch: amd64
            binary: mediacruncher-darwin-amd64
          - os: darwin
            arch: arm64
            binary: mediacruncher-darwin-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Extract Build Metadata
        id: meta
        shell: bash
        run: |
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          TIME=$(date -u +%Y%m%d-%H%M%S)
          VERSION="${{ github.ref_name }}"
          if [[ -z "$VERSION" || "$VERSION" == "main" || "$VERSION" == "master" ]]; then
            VERSION="dev"
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "time=$TIME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Binary (Pure Go Zero-CGO)
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${{ steps.meta.outputs.version }} -X mediacruncher/internal/observability.BuildVersion=${{ steps.meta.outputs.version }} -X mediacruncher/internal/observability.BuildCommit=${{ steps.meta.outputs.commit }} -X mediacruncher/internal/observability.BuildTime=${{ steps.meta.outputs.time }}"
          go build -trimpath -ldflags="$LDFLAGS" -o dist/${{ matrix.binary }} ./cmd/mediacruncher

      - name: Generate Checksum
        working-directory: dist
        run: sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256

  release:
    name: Publish GitHub Release
    needs: [build-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Sign Binaries (Optional)
        shell: bash
        run: |
          mkdir -p .signing
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > .signing/signing_key.pem
            chmod 600 .signing/signing_key.pem
            for dir in release-assets/*/; do
              binary=$(find "$dir" -maxdepth 1 -type f \( -name "mediacruncher-*" \) ! -name "*.sha256" ! -name "*.sig")
              if [ -n "$binary" ]; then
                openssl dgst -sha256 -sign .signing/signing_key.pem -out "${binary}.sig" "$binary"
                echo "Signed: $binary"
              fi
            done
          else
            echo "Notice: SIGNING_KEY secret not present or empty; skipping binary signature."
          fi

      - name: Create Combined Checksums
        shell: bash
        run: |
          > release-assets/checksums.txt
          for dir in release-assets/*/; do
            for file in "$dir"mediacruncher-*; do
              if [ -f "$file" ] && [[ "$file" != *.sha256 ]] && [[ "$file" != *.sig ]]; then
                (cd "$dir" && sha256sum "$(basename "$file")") >> release-assets/checksums.txt
              fi
            done
          done
          cat release-assets/checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*
            release-assets/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
